{
  "openapi": "3.0.0",
  "info": {
    "title": "E-Learning Platform API",
    "version": "1.0.0",
    "description": "A comprehensive e-learning platform backend with course management, enrollment, assessment, and payment features. This API supports multiple user roles including students, instructors, and administrators.",
    "contact": {
      "name": "API Support",
      "email": "support@elearning.com",
      "url": "https://elearning.com/support"
    },
    "license": {
      "name": "MIT",
      "url": "https://opensource.org/licenses/MIT"
    },
    "termsOfService": "https://elearning.com/terms"
  },
  "servers": [
    {
      "url": "http://localhost:5000",
      "description": "Development server"
    },
    {
      "url": "https://api.elearning.com",
      "description": "Production server"
    },
    {
      "url": "https://staging-api.elearning.com",
      "description": "Staging server"
    }
  ],
  "externalDocs": {
    "description": "Find out more about our API documentation",
    "url": "https://elearning.com/docs"
  },
  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT",
        "description": "JWT token obtained from /api/v1/auth/login. Include the token in the Authorization header as \"Bearer {token}\"."
      }
    },
    "schemas": {
      "SuccessResponse": {
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean",
            "example": true
          },
          "message": {
            "type": "string",
            "example": "Operation successful"
          }
        }
      },
      "ErrorResponse": {
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean",
            "example": false
          },
          "message": {
            "type": "string",
            "example": "An error occurred"
          },
          "error": {
            "type": "string",
            "nullable": true,
            "example": "Detailed error message"
          }
        }
      },
      "ValidationError": {
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean",
            "example": false
          },
          "message": {
            "type": "string",
            "example": "Validation failed"
          },
          "errors": {
            "type": "array",
            "items": {
              "type": "object",
              "properties": {
                "field": {
                  "type": "string"
                },
                "message": {
                  "type": "string"
                }
              }
            }
          }
        }
      },
      "Pagination": {
        "type": "object",
        "properties": {
          "page": {
            "type": "integer",
            "example": 1,
            "description": "Page number (starts from 1)"
          },
          "limit": {
            "type": "integer",
            "example": 10,
            "description": "Items per page"
          },
          "total": {
            "type": "integer",
            "example": 100,
            "description": "Total number of items"
          },
          "totalPages": {
            "type": "integer",
            "example": 10,
            "description": "Total number of pages"
          }
        }
      },
      "PaginatedResponse": {
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean",
            "example": true
          },
          "data": {
            "type": "array"
          },
          "pagination": {
            "$ref": "#/components/schemas/Pagination"
          }
        }
      },
      "User": {
        "type": "object",
        "properties": {
          "id": {
            "type": "integer",
            "example": 1
          },
          "name": {
            "type": "string",
            "example": "John Doe",
            "minLength": 2,
            "maxLength": 100
          },
          "email": {
            "type": "string",
            "format": "email",
            "example": "john@example.com"
          },
          "role": {
            "type": "string",
            "enum": [
              "student",
              "instructor",
              "admin"
            ],
            "example": "student"
          },
          "tier": {
            "type": "string",
            "enum": [
              "free",
              "premium"
            ],
            "example": "free"
          },
          "avatar": {
            "type": "string",
            "nullable": true,
            "example": "https://example.com/avatar.jpg"
          },
          "isApproved": {
            "type": "boolean",
            "nullable": true,
            "example": true
          },
          "approvedAt": {
            "type": "string",
            "format": "date-time",
            "nullable": true,
            "example": "2024-01-01T00:00:00.000Z"
          },
          "createdAt": {
            "type": "string",
            "format": "date-time",
            "example": "2024-01-01T00:00:00.000Z"
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time",
            "example": "2024-01-01T00:00:00.000Z"
          }
        },
        "example": {
          "id": 1,
          "name": "John Doe",
          "email": "john@example.com",
          "role": "student",
          "tier": "free",
          "avatar": null,
          "isApproved": true,
          "approvedAt": "2024-01-01T00:00:00.000Z",
          "createdAt": "2024-01-01T00:00:00.000Z",
          "updatedAt": "2024-01-01T00:00:00.000Z"
        }
      },
      "Course": {
        "type": "object",
        "properties": {
          "id": {
            "type": "integer",
            "example": 1
          },
          "title": {
            "type": "string",
            "example": "Introduction to Web Development",
            "minLength": 3,
            "maxLength": 200
          },
          "description": {
            "type": "string",
            "example": "Learn the basics of web development"
          },
          "category": {
            "type": "string",
            "example": "Programming",
            "minLength": 2,
            "maxLength": 50
          },
          "instructorId": {
            "type": "integer",
            "example": 1
          },
          "thumbnail": {
            "type": "string",
            "nullable": true,
            "example": "https://example.com/course-thumb.jpg"
          },
          "price": {
            "type": "number",
            "format": "decimal",
            "example": 99.99,
            "minimum": 0
          },
          "isPublished": {
            "type": "boolean",
            "example": false
          },
          "createdAt": {
            "type": "string",
            "format": "date-time",
            "example": "2024-01-01T00:00:00.000Z"
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time",
            "example": "2024-01-01T00:00:00.000Z"
          }
        },
        "example": {
          "id": 1,
          "title": "Introduction to Web Development",
          "description": "Learn the basics of web development",
          "category": "Programming",
          "instructorId": 1,
          "thumbnail": "https://example.com/course-thumb.jpg",
          "price": 99.99,
          "isPublished": false,
          "createdAt": "2024-01-01T00:00:00.000Z",
          "updatedAt": "2024-01-01T00:00:00.000Z"
        }
      },
      "SubCourse": {
        "type": "object",
        "properties": {
          "id": {
            "type": "integer",
            "example": 1
          },
          "courseId": {
            "type": "integer",
            "example": 1
          },
          "instructorId": {
            "type": "integer",
            "example": 1
          },
          "title": {
            "type": "string",
            "example": "HTML Basics",
            "minLength": 3,
            "maxLength": 200
          },
          "description": {
            "type": "string",
            "example": "Learn HTML fundamentals"
          },
          "thumbnail": {
            "type": "string",
            "nullable": true,
            "example": "https://example.com/subcourse-thumb.jpg"
          },
          "orderIndex": {
            "type": "integer",
            "example": 1,
            "minimum": 0
          },
          "isPublished": {
            "type": "boolean",
            "example": false
          },
          "createdAt": {
            "type": "string",
            "format": "date-time",
            "example": "2024-01-01T00:00:00.000Z"
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time",
            "example": "2024-01-01T00:00:00.000Z"
          }
        }
      },
      "Lesson": {
        "type": "object",
        "properties": {
          "id": {
            "type": "integer",
            "example": 1
          },
          "courseId": {
            "type": "integer",
            "example": 1
          },
          "subCourseId": {
            "type": "integer",
            "nullable": true,
            "example": 1
          },
          "title": {
            "type": "string",
            "example": "Introduction to HTML",
            "minLength": 3,
            "maxLength": 200
          },
          "content": {
            "type": "string",
            "example": "HTML is the foundation of web development"
          },
          "videoUrl": {
            "type": "string",
            "nullable": true,
            "example": "https://example.com/video.mp4"
          },
          "orderIndex": {
            "type": "integer",
            "example": 1,
            "minimum": 0
          },
          "createdAt": {
            "type": "string",
            "format": "date-time",
            "example": "2024-01-01T00:00:00.000Z"
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time",
            "example": "2024-01-01T00:00:00.000Z"
          }
        }
      },
      "Quiz": {
        "type": "object",
        "properties": {
          "id": {
            "type": "integer",
            "example": 1
          },
          "courseId": {
            "type": "integer",
            "example": 1
          },
          "subCourseId": {
            "type": "integer",
            "nullable": true,
            "example": 1
          },
          "lessonId": {
            "type": "integer",
            "nullable": true,
            "example": 1
          },
          "title": {
            "type": "string",
            "example": "HTML Quiz",
            "minLength": 3,
            "maxLength": 200
          },
          "questions": {
            "type": "array",
            "items": {
              "type": "object",
              "properties": {
                "question": {
                  "type": "string"
                },
                "options": {
                  "type": "array",
                  "items": {
                    "type": "string"
                  }
                },
                "correctOptionIndex": {
                  "type": "integer"
                }
              }
            }
          },
          "createdAt": {
            "type": "string",
            "format": "date-time",
            "example": "2024-01-01T00:00:00.000Z"
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time",
            "example": "2024-01-01T00:00:00.000Z"
          }
        }
      },
      "Enrollment": {
        "type": "object",
        "properties": {
          "id": {
            "type": "integer",
            "example": 1
          },
          "studentId": {
            "type": "integer",
            "example": 1
          },
          "courseId": {
            "type": "integer",
            "example": 1
          },
          "subCourseId": {
            "type": "integer",
            "nullable": true,
            "example": 1
          },
          "completedLessons": {
            "type": "array",
            "items": {
              "type": "integer"
            },
            "example": [
              1,
              2,
              3
            ]
          },
          "completionPercentage": {
            "type": "number",
            "format": "decimal",
            "example": 75.5,
            "minimum": 0,
            "maximum": 100
          },
          "status": {
            "type": "string",
            "enum": [
              "active",
              "completed",
              "dropped"
            ],
            "example": "active"
          },
          "enrolledAt": {
            "type": "string",
            "format": "date-time",
            "example": "2024-01-01T00:00:00.000Z"
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time",
            "example": "2024-01-01T00:00:00.000Z"
          }
        }
      },
      "Payment": {
        "type": "object",
        "properties": {
          "id": {
            "type": "integer",
            "example": 1
          },
          "userId": {
            "type": "integer",
            "example": 1
          },
          "courseId": {
            "type": "integer",
            "example": 1
          },
          "amount": {
            "type": "number",
            "format": "decimal",
            "example": 99.99,
            "minimum": 0
          },
          "status": {
            "type": "string",
            "enum": [
              "pending",
              "approved",
              "rejected"
            ],
            "example": "pending"
          },
          "proofImage": {
            "type": "string",
            "nullable": true,
            "example": "https://example.com/proof.jpg"
          },
          "rejectionReason": {
            "type": "string",
            "nullable": true,
            "example": "Invalid proof"
          },
          "approvedBy": {
            "type": "integer",
            "nullable": true,
            "example": 1
          },
          "approvedAt": {
            "type": "string",
            "format": "date-time",
            "nullable": true,
            "example": "2024-01-01T00:00:00.000Z"
          },
          "createdAt": {
            "type": "string",
            "format": "date-time",
            "example": "2024-01-01T00:00:00.000Z"
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time",
            "example": "2024-01-01T00:00:00.000Z"
          }
        }
      },
      "PublicUser": {
        "type": "object",
        "properties": {
          "id": {
            "type": "integer",
            "example": 1
          },
          "name": {
            "type": "string",
            "example": "John Doe"
          },
          "email": {
            "type": "string",
            "format": "email",
            "example": "john@example.com"
          },
          "role": {
            "type": "string",
            "enum": [
              "student",
              "instructor",
              "admin"
            ],
            "example": "student"
          },
          "tier": {
            "type": "string",
            "enum": [
              "free",
              "premium"
            ],
            "example": "free"
          },
          "avatar": {
            "type": "string",
            "nullable": true,
            "example": "https://example.com/avatar.jpg"
          },
          "createdAt": {
            "type": "string",
            "format": "date-time",
            "example": "2024-01-01T00:00:00.000Z"
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time",
            "example": "2024-01-01T00:00:00.000Z"
          }
        }
      },
      "QuizQuestion": {
        "type": "object",
        "required": [
          "question",
          "options",
          "correctOptionIndex"
        ],
        "properties": {
          "question": {
            "type": "string",
            "example": "What does HTML stand for?"
          },
          "options": {
            "type": "array",
            "items": {
              "type": "string"
            },
            "example": [
              "Hyper Text Markup Language",
              "High Text Machine Language"
            ]
          },
          "correctOptionIndex": {
            "type": "integer",
            "minimum": 0,
            "example": 0
          }
        }
      },
      "QuizSubmissionRequest": {
        "type": "object",
        "required": [
          "answers"
        ],
        "properties": {
          "answers": {
            "type": "array",
            "items": {
              "type": "object",
              "required": [
                "questionIndex",
                "selectedOptionIndex"
              ],
              "properties": {
                "questionIndex": {
                  "type": "integer",
                  "minimum": 0,
                  "example": 0
                },
                "selectedOptionIndex": {
                  "type": "integer",
                  "minimum": 0,
                  "example": 0
                }
              }
            }
          }
        },
        "example": {
          "answers": [
            {
              "questionIndex": 0,
              "selectedOptionIndex": 0
            },
            {
              "questionIndex": 1,
              "selectedOptionIndex": 1
            }
          ]
        }
      },
      "QuizSubmissionResult": {
        "type": "object",
        "properties": {
          "score": {
            "type": "integer",
            "minimum": 0,
            "maximum": 100,
            "example": 80,
            "description": "Percentage score, rounded"
          },
          "passed": {
            "type": "boolean",
            "example": true,
            "description": "True when the score is at least 70"
          },
          "totalQuestions": {
            "type": "integer",
            "example": 5
          },
          "correctAnswers": {
            "type": "integer",
            "example": 4
          }
        }
      },
      "RegisterRequest": {
        "type": "object",
        "required": [
          "name",
          "email",
          "password"
        ],
        "properties": {
          "name": {
            "type": "string",
            "minLength": 2,
            "maxLength": 100,
            "example": "John Doe"
          },
          "email": {
            "type": "string",
            "format": "email",
            "example": "john@example.com"
          },
          "password": {
            "type": "string",
            "minLength": 6,
            "maxLength": 100,
            "example": "password123"
          },
          "role": {
            "type": "string",
            "enum": [
              "student",
              "instructor",
              "admin"
            ],
            "example": "student"
          },
          "tier": {
            "type": "string",
            "enum": [
              "free",
              "premium"
            ],
            "example": "free"
          }
        },
        "example": {
          "name": "John Doe",
          "email": "john@example.com",
          "password": "password123",
          "role": "student",
          "tier": "free"
        }
      },
      "LoginRequest": {
        "type": "object",
        "required": [
          "email",
          "password"
        ],
        "properties": {
          "email": {
            "type": "string",
            "format": "email",
            "example": "john@example.com"
          },
          "password": {
            "type": "string",
            "example": "password123"
          }
        },
        "example": {
          "email": "john@example.com",
          "password": "password123"
        }
      },
      "AuthResponse": {
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean",
            "example": true
          },
          "message": {
            "type": "string",
            "example": "User registered successfully"
          },
          "token": {
            "type": "string",
            "example": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
          },
          "user": {
            "$ref": "#/components/schemas/User"
          }
        },
        "example": {
          "success": true,
          "message": "User registered successfully",
          "token": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...",
          "user": {
            "id": 1,
            "name": "John Doe",
            "email": "john@example.com",
            "role": "student",
            "tier": "free",
            "isApproved": true,
            "createdAt": "2024-01-01T00:00:00.000Z",
            "updatedAt": "2024-01-01T00:00:00.000Z"
          }
        }
      },
      "AdminDashboard": {
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean",
            "example": true
          },
          "dashboard": {
            "type": "object",
