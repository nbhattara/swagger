                  }
                }
              },
              "payments": {
                "type": "object",
                "properties": {
                  "pending": {
                    "type": "integer",
                    "example": 10
                  },
                  "approved": {
                    "type": "integer",
                    "example": 90
                  },
                  "rejected": {
                    "type": "integer",
                    "example": 5
                  },
                  "total": {
                    "type": "number",
                    "example": 8999.99
                  }
                }
              },
              "billing": {
                "type": "object",
                "properties": {
                  "invoices": {
                    "type": "integer",
                    "example": 100
                  },
                  "paid": {
                    "type": "integer",
                    "example": 85
                  }
                }
              },
              "certificates": {
                "type": "object",
                "properties": {
                  "issued": {
                    "type": "integer",
