                "type": "object",
                "properties": {
                  "total": {
                    "type": "integer",
                    "example": 100
                  },
                  "published": {
                    "type": "integer",
                    "example": 80
                  },
                  "latest": {
                    "type": "integer",
                    "example": 10
                  },
                  "enrollments": {
                    "type": "integer",
                    "example": 500
                  }
                }
              },
              "exams": {
                "type": "object",
                "properties": {
                  "total": {
                    "type": "integer",
                    "example": 200
                  },
                  "submissions": {
                    "type": "integer",
                    "example": 1500
                  },
                  "averageScore": {
                    "type": "number",
