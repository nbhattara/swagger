    "/api/v1/auth/oauth/exchange": {
      "post": {
        "summary": "Exchange a one-time OAuth code for a website access token",
        "tags": [
          "Authentication"
        ],
        "security": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "code"
                ],
                "properties": {
                  "code": {
                    "type": "string",
                    "pattern": "^[a-f0-9]{64}$"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Access token and user profile"
          },
          "400": {
            "description": "Invalid, expired, or already-used code"
          }
        }
      }
    },
    "/api/v1/auth/otp/request": {
      "post": {
        "summary": "Send an email OTP for a sensitive account action",
        "description": "Sends a cryptographically generated four-digit code to the authenticated, verified user's registered email. Codes expire in five minutes and may be requested once per minute.",
        "tags": [
          "Authentication"
        ],
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "purpose"
                ],
                "properties": {
                  "purpose": {
                    "type": "string",
                    "enum": [
                      "password_change",
                      "account_deactivation"
                    ]
                  }
                }
              }
            }
          }
        },
        "responses": {
          "202": {
            "description": "Verification email queued"
          },
          "429": {
            "description": "OTP request cooldown or email request limit reached"
          }
        }
      }
    },
    "/api/v1/auth/otp/verify": {
      "post": {
        "summary": "Verify an email OTP and issue a one-time authorization token",
        "description": "The returned token is bound to the authenticated user and purpose, expires in five minutes, and can authorize only one matching sensitive action.",
        "tags": [
          "Authentication"
        ],
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "purpose",
                  "otp"
                ],
                "properties": {
                  "purpose": {
                    "type": "string",
                    "enum": [
                      "password_change",
                      "account_deactivation"
                    ]
                  },
                  "otp": {
                    "type": "string",
                    "pattern": "^[0-9]{4}$"
                  }
                }
              }
            }
          }
        },
        "responses": {
