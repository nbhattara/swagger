{
  "openapi": "3.0.0",
  "info": {
    "title": "E-Learning Platform API",
    "version": "1.0.0",
    "description": "\n# E-Learning Platform Backend API\n\nA comprehensive e-learning platform backend providing course management, enrollment, assessment, and payment features.\n\n## Features\n\n- **Multi-Role Support**: Students, Instructors, and Administrators\n- **Course Management**: Create, update, and publish courses with lessons and quizzes\n- **Enrollment System**: Student enrollment with progress tracking\n- **Payment Processing**: Secure payment workflow with approval system\n- **Assessment Tools**: Quizzes, exams, and answer submissions\n- **Live Classes**: Scheduled live sessions with meeting links\n- **Content Management**: Posts, announcements, and multimedia support\n- **Notifications**: Real-time user notifications\n- **Certificates**: Auto-generated completion certificates\n\n## Authentication\n\nThis API uses JWT (JSON Web Token) authentication. Most endpoints require a valid JWT token in the Authorization header:\n\n```\nAuthorization: Bearer <your-jwt-token>\n```\n\n### Getting a Token\n\n1. **Register**: POST `/api/v1/auth/register`\n2. **Login**: POST `/api/v1/auth/login`\n3. **OAuth**: GET `/api/v1/auth/oauth/{provider}` (Google, Facebook, GitHub)\n\n## Rate Limiting\n\nAPI endpoints are rate-limited to prevent abuse:\n- Auth endpoints: 5 requests per 15 minutes\n- General endpoints: 100 requests per 15 minutes\n- Email actions: 3 requests per hour\n\n## Error Responses\n\nAll errors follow this format:\n\n```json\n{\n  \"success\": false,\n  \"message\": \"Error description\",\n  \"error\": \"Detailed error message (development only)\"\n}\n```\n\nCommon HTTP status codes:\n- `200` - Success\n- `201` - Created\n- `400` - Bad Request (validation error)\n- `401` - Unauthorized (invalid or missing token)\n- `403` - Forbidden (insufficient permissions)\n- `404` - Not Found\n- `429` - Too Many Requests (rate limit exceeded)\n- `500` - Internal Server Error\n      ",
    "contact": {
      "name": "Development Team",
      "email": "dev-team@utkristashikshya.com"
    },
    "license": {
      "name": "Proprietary"
    }
  },
  "servers": [
    {
