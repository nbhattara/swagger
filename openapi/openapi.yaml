                    "type": "integer",
                    "example": 70
                  },
                  "revoked": {
                    "type": "integer",
                    "example": 5
                  }
                }
              },
              "revenue": {
                "type": "object",
                "properties": {
                  "monthly": {
                    "type": "number",
