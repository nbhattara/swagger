          }
        }
      },
      "StudentDashboard": {
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean",
            "example": true
          },
          "dashboard": {
            "type": "object",
            "properties": {
              "enrollments": {
                "type": "object",
                "properties": {
                  "total": {
                    "type": "integer",
                    "example": 5
                  },
